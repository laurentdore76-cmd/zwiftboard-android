name: Compilation APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Tests et compilation
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk zwiftboard-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zwiftboard-android
          path: zwiftboard-android.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZwiftBoard Android (build ${{ github.run_number }})
          files: zwiftboard-android.apk
          make_latest: true
